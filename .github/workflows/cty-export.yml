name: Export CTY test file

on:
  push:
    branches:
      - sp2bpa-cty-update
    paths:
      - 'SP2BPA/cty/cty.dat'
      - '.github/workflows/cty-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload cty.dat
        uses: actions/upload-artifact@v4
        with:
          name: cty-dat-test
          path: SP2BPA/cty/cty.dat
          if-no-files-found: error
